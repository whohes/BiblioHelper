name: Сборка и тесты

on:
  push:
    branches: [main]
    # Тег v1.2.3 — выпуск версии: установщик выкладывается в GitHub Releases,
    # и программы у пользователей предложат обновиться.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Основная сборка: Qt 5.15 + MinGW 32 бита, запускается на Windows 7–11.
  windows-win32:
    name: Windows (Qt 5.15, 32 бита)
    runs-on: windows-2022
    permissions:
      contents: write   # только для выпуска релиза по тегу
    steps:
      - uses: actions/checkout@v4

      - name: Установить Qt 5.15.2 и MinGW 8.1 (32 бита)
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win32_mingw81
          tools: 'tools_mingw,qt.tools.win32_mingw810'
          cache: true

      # OpenSSL 1.1.1 (32 бита) — для HTTPS (проверка обновлений); Qt 5.15 сам его не содержит.
      - name: Скачать OpenSSL 1.1.1 (32 бита)
        shell: pwsh
        run: |
          $out = 'C:\openssl-qt'
          $list = python -m aqt list-tool windows desktop
          $list
          $candidates = @($list | Where-Object { $_ -match 'openssl' -and $_ -notmatch 'v3' -and $_ -match 'x86|win32' })
          foreach ($tool in $candidates) {
            python -m aqt list-tool windows desktop $tool
            python -m aqt install-tool windows desktop $tool --outputdir $out
          }
          $dll = Get-ChildItem $out -Recurse -Filter libssl-1_1.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            # Запасной путь: последняя сборка OpenSSL 1.1.1 из архива MSYS2 (mingw32).
            $idx = (Invoke-WebRequest -UseBasicParsing https://repo.msys2.org/mingw/mingw32/).Content
            $name = [regex]::Matches($idx, 'mingw-w64-i686-openssl-1\.1\.1[^"<>]*?\.pkg\.tar\.(zst|xz)(?=")') |
              ForEach-Object Value | Select-Object -Last 1
            "MSYS2: $name"
            if ($name) {
              New-Item -ItemType Directory -Force "$out\msys2" | Out-Null
              Invoke-WebRequest -UseBasicParsing "https://repo.msys2.org/mingw/mingw32/$name" -OutFile "$out\$name"
              & C:\msys64\usr\bin\tar.exe -xf "/c/openssl-qt/$name" -C /c/openssl-qt/msys2
              $dll = Get-ChildItem $out -Recurse -Filter libssl-1_1.dll -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          if (-not $dll) { throw 'Не найден libssl-1_1.dll (32 бита)' }
          "OPENSSL_BIN=$($dll.DirectoryName)" >> $env:GITHUB_ENV
          Get-ChildItem $dll.DirectoryName

      - name: Подключить компилятор MinGW 8.1 (32 бита)
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:IQTA_TOOLS\mingw810_32\bin"

      - name: Настроить сборку
        shell: pwsh
        run: >
          cmake -S . -B build -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Собрать
        run: cmake --build build -j 4

      - name: Автотесты
        env:
          QT_FORCE_STDERR_LOGGING: 1
        run: ctest --test-dir build --output-on-failure

      - name: Подробности, если тесты упали
        if: failure()
        shell: pwsh
        env:
          # Без консоли Qt пишет сообщения в OutputDebugString, а не в лог.
          QT_FORCE_STDERR_LOGGING: 1
        run: |
          Get-Command libstdc++-6.dll, libgcc_s_dw2-1.dll, Qt5Core.dll -All -ErrorAction SilentlyContinue | Format-Table Source
          & build\tests\test_xlsx_roundtrip.exe -v1
          "Код выхода: 0x{0:X8}" -f $LASTEXITCODE
          gdb -batch -ex run -ex bt --args build\tests\test_xlsx_roundtrip.exe -v1

      - name: Собрать папку с программой
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\src\BiblioHelper.exe dist\
          # Явный путь: в PATH раннера есть и другие qmake/windeployqt.
          $qtBin = Join-Path $env:QT_ROOT_DIR 'bin'
          Get-ChildItem (Join-Path $env:QT_ROOT_DIR 'plugins\platforms') | Select-Object -ExpandProperty Name
          # Без --release: windeployqt 5.15 для MinGW сам определяет тип сборки,
          # а с этим флагом может не найти platforms\qwindows.dll.
          & (Join-Path $qtBin 'windeployqt.exe') --no-translations --compiler-runtime dist\BiblioHelper.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist\platforms\qwindows.dll)) { throw 'Нет platforms\qwindows.dll' }
          # OpenSSL для HTTPS: Qt ищет эти DLL рядом с программой.
          $ssl = $env:OPENSSL_BIN
          Get-ChildItem $ssl
          Copy-Item (Join-Path $ssl 'libssl-1_1.dll'), (Join-Path $ssl 'libcrypto-1_1.dll') dist\
          # Программа сама проверяет, что HTTPS доступен (код выхода 0).
          $p = Start-Process dist\BiblioHelper.exe -ArgumentList '--check-https' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "HTTPS недоступен в сборке (код $($p.ExitCode))" }

      - name: Собрать установщик
        id: setup
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'VERSION\s+(\d+\.\d+\.\d+)').Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc /Qp "/DAppVersion=$version" installer\BiblioHelper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer-out

      - uses: actions/upload-artifact@v4
        with:
          name: BiblioHelper-setup
          path: installer-out/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: BiblioHelper-win32
          path: dist/

      - name: Выпустить версию (только по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.setup.outputs.version }}
        run: |
          if ("${{ github.ref_name }}" -ne "v$env:VERSION") { throw "Тег ${{ github.ref_name }} не совпадает с версией $env:VERSION в CMakeLists.txt" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem installer-out\*.exe).FullName `
            --title "BiblioHelper $env:VERSION" --notes-file RELEASE_NOTES.md

  # Быстрая проверка, что код собирается и на Linux (системный Qt 5.15).
  linux:
    name: Linux (Qt 5.15)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Установить Qt 5
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qtbase5-private-dev
      - name: Собрать
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Автотесты
        run: ctest --test-dir build --output-on-failure
